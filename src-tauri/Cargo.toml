[package]
name = "dot-md"
version = "1.0.0"
description = "Publication-grade Markdown editor and standalone viewer"
authors = ["dot md team"]
edition = "2021"


[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon", "image-ico"] }
tauri-plugin-fs = "2.0.0"
tauri-plugin-dialog = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
notify = "6.1"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
